[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-depth-anything"
version = "0.2.0"
description = "Text-grounded instance segmentation, monocular depth, and 3D position extraction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub>=0.36,<2",
  "hydra-core>=1.3.2,<2",
  "iopath>=0.1.10,<1",
  "numpy>=1.26,<2",
  "opencv-python>=4.10,<5",
  "open3d>=0.19,<0.20",
  "pillow>=10,<13",
  "pycocotools>=2.0.8,<3",
  "psutil>=5.9,<8",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "supervision>=0.22,<1",
  "torch>=2.10,<2.11",
  "torchvision>=0.25,<0.26",
  "transformers==4.57.6",
  "typing-extensions>=4.12",
]

[project.scripts]
gda = "gda.pipeline:main"
gda-depth = "gda.modules.depth_estimation:main"
gda-detect = "gda.modules.object_detection:main"
gda-segment-boxes = "gda.modules.object_segmentation:main"
gda-segment = "gda.modules.grounded_segmentation:main"
gda-positions = "gda.image_to_positions:main"

[tool.setuptools]
packages = ["gda", "gda.modules"]
package-dir = { gda = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA and model checkpoints"]

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
